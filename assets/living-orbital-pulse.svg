<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%" preserveAspectRatio="none">
<defs>
  <linearGradient id="cyanFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="25%" stop-color="#7B2CBF"/>
    <stop offset="50%" stop-color="#00F5D4"/>
    <stop offset="75%" stop-color="#FF007F"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<style>
  @keyframes particle { 0% { transform: translateX(-50px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(1250px); opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
</style>
<line x1="0" y1="15.0" x2="1200" y2="15.0" stroke="url(#cyanFlow)" stroke-width="1.8" filter="url(#glow)" style="animation: pulse 3s ease-in-out infinite;"/>
