<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%">
  <defs>
    <linearGradient id="isoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00599C"/>
    </linearGradient>
    <linearGradient id="isoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="isoGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="isoGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glowCrisp">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-iso { fill: #0B0E14; rx: 12px; stroke: #21262D; stroke-width: 1.5; }
    .header-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #00D4FF; letter-spacing: 1.5px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #8B949E; }
    .bus-beam { stroke-dasharray: 6,4; animation: beamPulse 1.8s linear infinite; }
    @keyframes beamPulse { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
  </style>

  <rect width="100%" height="100%" class="bg-iso"/>

  <!-- Top Title -->
  <text x="30" y="36" class="header-text">3D_DISTRIBUTED_PIPELINE // HARDWARE TO ORBIT</text>
  <text x="870" y="36" font-family="monospace" font-size="12" fill="#00F5D4" text-anchor="end">SAMSUNG R&amp;D ARCHITECTURE</text>
  <line x1="30" y1="50" x2="870" y2="50" stroke="#21262D" stroke-width="1.5"/>

  <!-- Horizontal Interconnect Laser Beam -->
  <line x1="120" y1="135" x2="780" y2="135" stroke="#21262D" stroke-width="3"/>
  <line x1="120" y1="135" x2="780" y2="135" stroke="#00D4FF" stroke-width="1.8" class="bus-beam" opacity="0.8"/>

  <!-- ================= NODE 1: SILICON & CUDA ================= -->
  <g transform="translate(120, 135)">
    <!-- 3D Isometric Diamond Cube -->
    <g filter="url(#glowCrisp)">
      <polygon points="0,-32 44,0 0,32 -44,0" fill="url(#isoGrad1)" opacity="0.9"/>
      <polygon points="-44,0 0,32 0,44 -44,12" fill="#00599C"/>
      <polygon points="44,0 0,32 0,44 44,12" fill="#00D4FF" opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#0B0E14" stroke="#00D4FF" stroke-width="1.5"/>
    <text x="0" y="4.5" font-size="11" fill="#00D4FF" text-anchor="middle" font-family="monospace" font-weight="bold">⚡</text>

    <!-- Labels -->
    <text x="0" y="65" class="node-title" fill="#00D4FF" text-anchor="middle">Silicon &amp; CUDA</text>
    <text x="0" y="82" class="node-sub" text-anchor="middle">Triton &amp; FlashAttn</text>
  </g>

  <!-- ================= NODE 2: QUANTUM COMPILER ================= -->
  <g transform="translate(340, 135)">
    <g filter="url(#glowCrisp)">
      <polygon points="0,-32 44,0 0,32 -44,0" fill="url(#isoGrad2)" opacity="0.9"/>
      <polygon points="-44,0 0,32 0,44 -44,12" fill="#6366F1"/>
      <polygon points="44,0 0,32 0,44 44,12" fill="#A855F7" opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#0B0E14" stroke="#A855F7" stroke-width="1.5"/>
    <text x="0" y="4.5" font-size="11" fill="#A855F7" text-anchor="middle" font-family="monospace" font-weight="bold">⚛️</text>

    <!-- Labels -->
    <text x="0" y="65" class="node-title" fill="#A855F7" text-anchor="middle">DisCoCat QNLP</text>
    <text x="0" y="82" class="node-sub" text-anchor="middle">NISQ Gate Compiler</text>
  </g>

  <!-- ================= NODE 3: SWARM ROBOTICS ================= -->
  <g transform="translate(560, 135)">
    <g filter="url(#glowCrisp)">
      <polygon points="0,-32 44,0 0,32 -44,0" fill="url(#isoGrad3)" opacity="0.9"/>
      <polygon points="-44,0 0,32 0,44 -44,12" fill="#059669"/>
      <polygon points="44,0 0,32 0,44 44,12" fill="#10B981" opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#0B0E14" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="4.5" font-size="11" fill="#10B981" text-anchor="middle" font-family="monospace" font-weight="bold">🤖</text>

    <!-- Labels -->
    <text x="0" y="65" class="node-title" fill="#10B981" text-anchor="middle">Swarm Robotics</text>
    <text x="0" y="82" class="node-sub" text-anchor="middle">MARL &amp; 3DGS Vision</text>
  </g>

  <!-- ================= NODE 4: ORBITAL EDGE AI ================= -->
  <g transform="translate(780, 135)">
    <g filter="url(#glowCrisp)">
      <polygon points="0,-32 44,0 0,32 -44,0" fill="url(#isoGrad4)" opacity="0.9"/>
      <polygon points="-44,0 0,32 0,44 -44,12" fill="#8B5CF6"/>
      <polygon points="44,0 0,32 0,44 44,12" fill="#EC4899" opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#0B0E14" stroke="#EC4899" stroke-width="1.5"/>
    <text x="0" y="4.5" font-size="11" fill="#EC4899" text-anchor="middle" font-family="monospace" font-weight="bold">🛰️</text>

    <!-- Labels -->
    <text x="0" y="65" class="node-title" fill="#EC4899" text-anchor="middle">Orbital Edge AI</text>
    <text x="0" y="82" class="node-sub" text-anchor="middle">LEO Federated Mesh</text>
  </g>
</svg>