<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" preserveAspectRatio="none">
<defs>
  <linearGradient id="cyberWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="25%" stop-color="#7B2CBF"/>
    <stop offset="50%" stop-color="#00F5D4"/>
    <stop offset="75%" stop-color="#FF007F"/>
    <stop offset="100%" stop-color="#00D4FF"/>
  </linearGradient>
  <filter id="waveGlow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<style>
  @keyframes wavePulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
  @keyframes flowParticle { 0% { transform: translateX(-40px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(1240px); opacity: 0; } }
</style>
<path d="M 0 20.0 Q 300 8.0 600 20.0 T 1200 20.0" fill="none" stroke="url(#cyberWaveGrad)" stroke-width="2" filter="url(#waveGlow)" style="animation: wavePulse 3s ease-in-out infinite;"/>
